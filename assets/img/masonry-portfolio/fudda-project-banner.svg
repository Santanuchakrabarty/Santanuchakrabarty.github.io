<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Fudda project banner</title>
<desc>Food delivery and chef booking app banner with gradient background and food icons</desc>
<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FF7A45"/>
<stop offset="55%" stop-color="#FF4D6D"/>
<stop offset="100%" stop-color="#C9184A"/>
</linearGradient>
<linearGradient id="circleFade" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="800" height="450" fill="url(#bg)"/>

<circle cx="680" cy="80" r="180" fill="url(#circleFade)"/>
<circle cx="60" cy="400" r="140" fill="url(#circleFade)"/>
<circle cx="750" cy="400" r="70" fill="#FFFFFF" fill-opacity="0.06"/>

<g transform="translate(90,120)" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<line x1="0" y1="0" x2="0" y2="70"/>
<line x1="14" y1="0" x2="14" y2="30"/>
<line x1="14" y1="30" x2="14" y2="70"/>
<line x1="28" y1="0" x2="28" y2="30"/>
<line x1="28" y1="30" x2="14" y2="42"/>
<line x1="0" y1="0" x2="0" y2="16"/>
<line x1="0" y1="16" x2="28" y2="16"/>
</g>

<g transform="translate(140,120)" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
