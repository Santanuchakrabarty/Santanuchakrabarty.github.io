<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Medepal project banner</title>
<desc>Healthcare telemedicine app banner with gradient background, medical cross, heartbeat pulse and video call icons</desc>
<defs>
<linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0EA5A0"/>
<stop offset="55%" stop-color="#0D8ABC"/>
<stop offset="100%" stop-color="#1B4F9C"/>
</linearGradient>
<linearGradient id="circleFade2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="800" height="450" fill="url(#bg2)"/>

<circle cx="690" cy="90" r="180" fill="url(#circleFade2)"/>
<circle cx="50" cy="410" r="140" fill="url(#circleFade2)"/>
<circle cx="740" cy="400" r="70" fill="#FFFFFF" fill-opacity="0.06"/>

<g transform="translate(600,60)">
