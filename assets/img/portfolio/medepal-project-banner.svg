<rect x="0" y="18" width="52" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.9"/>
</g>

<g transform="translate(80,120)" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M0 34 L26 34 L34 14 L46 54 L58 24 L66 34 L96 34"/>
</g>

<g transform="translate(600,320)" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<rect x="0" y="6" width="52" height="38" rx="6"/>
<path d="M52 18 L74 6 L74 44 L52 32"/>
</g>

<text x="90" y="270" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">Medepal</text>
<text x="90" y="315" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#FFFFFF" fill-opacity="0.92">Healthcare &amp; telemedicine platform</text>

